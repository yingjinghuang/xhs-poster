name: Apply custom theme upgrade

on:
  push:
    branches: ["agent/custom-themes"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/custom-themes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply source changes
        run: python3 scripts/apply_custom_themes.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Commit validated changes
        run: |
          rm scripts/apply_custom_themes.py
          rm .github/workflows/apply-custom-themes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md scripts .github
          git commit -m "Add curated and custom color themes"
          git push origin agent/custom-themes
